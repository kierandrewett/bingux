# Bingux integration defaults for Gnoblin.
# Load this fragment from gnoblin.toml with:
#   include = ["/usr/share/bingux/gnoblin.toml"]
# Source installs use their installed share/bingux path instead.

[shell]
# Bingux renders the OSD surface and consumes Gnoblin's OSD records.
osd = false

[protocols]
# These are the protocols used by Bingux's panels and capture/search surfaces.
wlr-layer-shell = true
wlr-screencopy = true
ext-foreign-toplevel-list = true
wlr-foreign-toplevel-management = true
ext-data-control = true

# Bingux owns the entry/exit motion for these surfaces. Keeping compositor
# animation off prevents two independent animations from fighting each other.
[[window-rules]]
match.layer = "^(bingux-[a-z0-9-]+|gnoblin-(shell-popup|dock-tooltip))$"
animation = "none"
