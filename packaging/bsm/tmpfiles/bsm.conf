# Runtime and state directories of bsm. All of them are harmless on a machine
# that boots greetd: nothing uses them.
#
# /run/bsm             sockets: greeter Wayland and control, per-session sockets
# /run/bsm/sessions    0711: hosted sessions traverse it to reach their own
#                      single-use socket (random name, checked on accept)
# /var/lib/bsm         last user, session registry metadata (no secrets)
# /var/lib/bingux/bsm-greeter-home  HOME of the greeter (Qt caches)
d /run/bsm                          0755 bsm             bsm             -
d /run/bsm/sessions                 0711 bsm             bsm             -
d /var/lib/bsm                      0750 bsm             bsm             -
d /var/lib/bingux                   0755 root            root            -
d /var/lib/bingux/bsm-greeter-home  0700 bingux-greeter  bingux-greeter  -
