# Installed as /usr/lib/systemd/system/plymouth-quit.service.d/10-bsm.conf.
#
# When bsm is the display manager it takes the display over from the boot splash
# and withdraws the splash itself once the greeter is on screen
# (bsm-plymouth-handover, called from bsm.service). The stock plymouth-quit.service
# would blank the splash as soon as user sessions are allowed, so it runs after
# bsm. This is ordering only, no dependency and no Conflicts=: on a boot without
# bsm (greetd, or bsm.service skipped by ConditionKernelCommandLine=) bsm.service
# is not in the transaction or ends at once, and plymouth-quit.service runs as
# before. Conflicts= is avoided on purpose: systemd applies it even when the
# conflicting unit's own condition fails, which would stop plymouth-quit on every
# greetd boot and leave greetd waiting for the splash for ever.
[Unit]
After=bsm.service
