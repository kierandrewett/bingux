# Applied by bsm.service (ExecStartPre=+) and not by systemd-tmpfiles at boot.
#
# The greetd login screen shares /var/lib/bingux/greeter: it is sticky and
# world-writable (bingux-greeter.conf) so every account can publish its own
# snapshot directory. bsm is the only writer of the greeter cache while it runs,
# so bsm takes the directory over: owner bsm, 0755. A hostile local account can
# then not create <uid> directories in it before bsm does. The next boot
# without bsm applies bingux-greeter.conf again and restores the shared mode.
d /var/lib/bingux/greeter 0755 bsm bsm -
