# Accounts of the Bingux Session Manager.
#
# bsm      the compositor and session manager. Unprivileged; reaches the seat
#          through seatd (group bsm) and has no login.
# bingux-greeter  the restricted greeter Quickshell. No login, no sudo; sees
#          only the sockets bsm creates for it and the published greeter cache.
u bsm            - "Bingux Session Manager" /var/lib/bsm /usr/bin/nologin
u bingux-greeter - "Bingux greeter"          /var/lib/bingux/bsm-greeter-home /usr/bin/nologin
# The greeter allocates dmabufs on the GPU render node.
m bingux-greeter render
