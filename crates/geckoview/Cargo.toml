[package]
name = "bingux-geckoview"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "The glue between the Vivarium engine and bingux-ui: the browser backend, its events, page frames and input"
authors = ["Kieran Drewett"]
homepage = "https://github.com/kierandrewett/bingux"
repository = "https://github.com/kierandrewett/bingux"

[features]
default = []
# `TestDoubleBackend`: an in-memory `BrowserBackend` for tests of the UI logic
# and for the browser's headless snapshots. Never part of a shipped browser.
test-double = []
# The real backend over the `vivarium` crate (the engine).
vivarium = ["dep:vivarium", "dep:vivarium-sys"]
# The same, but `libvivarium.so` is opened at run time (`dlopen`, after the
# loader's trust checks) instead of linked at build time: it needs the SDK's
# headers and no library. When both are on, this one wins.
dynamic-load = ["vivarium", "vivarium/dynamic-load"]

[dependencies]
freya = { version = "0.5.0-rc.10", features = ["borderless", "titlebar"] }
bingux-ui = { path = "../ui" }
# The engine's Rust API, from the Vivarium repository next to this one.
vivarium = { path = "../../../vivarium/rust/vivarium", optional = true }
# The ABI's constants (`VV_EVENT_*`) for the capability bitmaps; the link mode
# is the `vivarium` crate's choice.
vivarium-sys = { path = "../../../vivarium/rust/vivarium-sys", default-features = false, optional = true }

[dev-dependencies]
# The tests run in the same feature set as the apps' snapshot builds.
bingux-ui = { path = "../ui", features = ["testing"] }

# Desktop scroll feel; see ../../vendor/README.md.
[patch.crates-io]
freya-winit = { path = "../../vendor/freya-winit" }
freya-core = { path = "../../vendor/freya-core" }
freya-animation = { path = "../../vendor/freya-animation" }
freya-components = { path = "../../vendor/freya-components" }

# Same profile as the apps: optimised dependencies, a quick rebuild of the
# crate itself.
[profile.dev.package."*"]
opt-level = 2
debug-assertions = false
overflow-checks = false

[profile.dev.package.bingux-ui]
opt-level = 2
debug-assertions = false
overflow-checks = false

# Panics unwind, in dev and in release (see the apps' Cargo.toml).
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
