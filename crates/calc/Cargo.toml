[package]
name = "bingux-calc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Bingux calculator engine: exact arithmetic, scientific functions, programmer integers, unit and currency conversion; no UI"

[lib]
path = "src/lib.rs"

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
