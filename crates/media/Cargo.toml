[package]
name = "bingux-media"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Bingux media engine: playback through libmpv, the music and film library, MPRIS and scrobbling; no UI"

[lib]
path = "src/lib.rs"

# Links libmpv (`libmpv-dev` to build, `libmpv2` to run; mpv 0.35 or later) and
# libEGL (the off-screen context of the GPU renderer).

[dependencies]
# Frames are handed to the window without a copy (`Bytes::from_owner`).
bytes = "1.9"
# XDG user folders, freedesktop thumbnail names, file URIs.
bingux-files = { path = "../files" }
# The library index. `bundled`: one SQLite, the same everywhere.
rusqlite = { version = "0.37", features = ["bundled"] }
# Tags and cover art of songs (MIT or Apache-2.0).
lofty = "0.22"
# Freedesktop thumbnails of films.
png = "0.17"
# MPRIS on the session bus.
zbus = { version = "5", default-features = false, features = ["async-io"] }
async-channel = "2"
# Settings and the Last.fm account.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Last.fm: HTTPS (rustls) and the call signature.
ureq = "3"
md-5 = "0.10"

[profile.dev.package."*"]
opt-level = 2
debug-assertions = false
overflow-checks = false
