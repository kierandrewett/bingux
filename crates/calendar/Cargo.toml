[package]
name = "bingux-calendar-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Bingux Calendar model: events, iCalendar files, recurrence, the local store, reminders; no UI"

[lib]
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
ical = { version = "0.11", default-features = false, features = ["ical"] }
rrule = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
