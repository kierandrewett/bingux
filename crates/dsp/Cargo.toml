[package]
name = "bingux-dsp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "LADSPA effect plugins for the Bingux sound effects: dynamics, tone and space"

[lib]
name = "bingux_dsp"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
