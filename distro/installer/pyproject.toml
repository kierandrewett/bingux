[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bingux-installer"
version = "0.1.0"
description = "Bingux OS live-ISO disk installer: client CLI and socket-activated root daemon"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = ["python-blivet"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
bingux-installer = "bingux_installer.cli:main"
bingux-installer-daemon = "bingux_installer.daemon:main"

[tool.setuptools]
packages = ["bingux_installer"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
