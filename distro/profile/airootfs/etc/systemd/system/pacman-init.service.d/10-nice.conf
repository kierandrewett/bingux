# The keyring set-up takes about 9 s of CPU (gpg, measured in the booted ISO) and
# runs while the live session starts. Gnoblin gives up when its start is slow,
# and the live image then shows the greeter or a black screen instead of the
# installer, so the keyring takes the CPU the compositor does not use. Not idle
# scheduling: the installer needs the keyring and must not wait for it behind
# other work.
[Service]
Nice=19
