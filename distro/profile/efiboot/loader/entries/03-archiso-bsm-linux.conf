title    Bingux OS live with bsm session manager, experimental (%ARCH%, UEFI)
sort-key 03
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% bingux.bsm quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 systemd.condition_needs_update=0 %KERNEL_PARAMS%
