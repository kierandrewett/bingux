LABEL bingux
TEXT HELP
Boot the Bingux OS live image on BIOS.
It allows you to install Bingux OS or perform system maintenance.
ENDTEXT
MENU LABEL Bingux OS live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 systemd.condition_needs_update=0 %KERNEL_PARAMS%

# Accessibility boot option
LABEL bingux-speech
TEXT HELP
Boot the Bingux OS live image on BIOS with speakup screen reader.
It allows you to install Bingux OS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Bingux OS live (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 systemd.condition_needs_update=0 %KERNEL_PARAMS%
