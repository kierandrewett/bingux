# BIOS boot menu of the live image. This file replaces the one from archiso's
# releng profile: the default is the Bingux live entry (releng names "arch",
# which archiso_sys-linux.cfg does not define), and the menu waits 5 s, not
# 15 s. TIMEOUT is in tenths of a second.
INCLUDE archiso_head.cfg

DEFAULT bingux
TIMEOUT 50

INCLUDE archiso_sys-linux.cfg

INCLUDE archiso_tail.cfg
