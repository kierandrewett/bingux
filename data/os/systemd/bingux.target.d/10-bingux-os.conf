# Bingux OS only: pulls in the login-screen wallpaper units that the image's greeter reads.
# They are not part of the `bingux` package, so bingux.target itself does not want them.
# scripts/install-shell.py installs this drop-in only with --os-image.
[Unit]
Wants=bingux-greeter-export.service bingux-greeter-export.path bingux-bsm-publish.service bingux-bsm-publish.path
