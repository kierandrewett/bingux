<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System bus policy of org.bingux.Session1, the D-Bus API of bsm.

  The bus lets every local account talk to bsm and nothing else own the name.
  The method ACL is inside bsm, which checks each call against the peer's
  credentials from the bus (uid, pid, and from the pid the logind session and
  systemd scope) and never trusts an argument for who the caller is:

    GetUsers, GetSessions, GetSelectedUser, GetForegroundSession, GetStatus,
    GetOutputs, GetTransitions   read-only; any local uid
    RequestLock, RequestLogout   the caller must be inside that session's scope
                                 (or root)
    RequestSwitchUser            the caller's own session
    RequestSuspend, RequestReboot, RequestPowerOff
                                 hosted-session callers are checked with polkit
                                 (org.freedesktop.login1.*); root is allowed
    CancelOperation              the account that requested it, or root
    PublishAppearance            any eligible uid; the uid is the bus peer's

  The greeter account uses the private control socket for everything else
  (docs/bsm/architecture.md, D5), never D-Bus.
-->
<busconfig>
  <policy user="bsm">
    <allow own="org.bingux.Session1"/>
  </policy>

  <policy context="default">
    <deny own="org.bingux.Session1"/>
    <allow send_destination="org.bingux.Session1"/>
    <allow receive_sender="org.bingux.Session1"/>
  </policy>
</busconfig>
