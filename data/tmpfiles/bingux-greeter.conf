# Per-account login-screen snapshots. Sticky and world-writable like /tmp so
# each account creates and owns its own subdirectory; bingux-session only
# trusts a snapshot whose directory is owned by the account it names.
d /var/lib/bingux 0755 root root -
d /var/lib/bingux/greeter 1777 root root -
# The greetd account's working home: distributions create that account with
# no writable home, and the greeter compositor needs one for session state and
# caches (see bingux-greeter-session).
d /var/lib/bingux/greeter-home 0700 greeter greeter -
