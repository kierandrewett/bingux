[package]
name = "bingux-preview-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Bingux preview host: the helper process that plays media (GStreamer) and renders documents (poppler) for file previews"
authors = ["Kieran Drewett"]
homepage = "https://github.com/kierandrewett/bingux"
repository = "https://github.com/kierandrewett/bingux"

[[bin]]
name = "bingux-preview-host"
path = "src/main.rs"

[dependencies]
bingux-preview-core = { path = "../../crates/preview-core" }
libc = "0.2"
# Audio and video. Linked here and nowhere else: a codec bug takes this
# process, not the file manager.
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
# PDF pages and text. `v21_12` is `poppler_document_new_from_fd`, which reads
# the descriptor the viewer opened instead of a path.
poppler-rs = { version = "0.25", features = ["v21_12"] }
glib = "0.21"
cairo-rs = "0.21"
# A PDF's outline: `poppler-rs` has no safe reader for an outline entry's
# action, so `outline.rs` walks the index iterator through the C interface.
poppler-sys-rs = "0.25"
# Pictures a viewer's own codecs do not read: TIFF, Radiance HDR, OpenEXR, and
# the JPEG a camera RAW file carries. Only the decoders that are used.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp", "ico", "hdr", "exr"] }
# The orientation of a camera RAW file (a TIFF-structured container).
kamadak-exif = "0.6"
# HEIF and AVIF. LGPL libheif, linked here and nowhere else.
libheif-rs = { version = "2", default-features = false, features = ["v1_17"] }

[profile.dev.package."*"]
opt-level = 2
debug-assertions = false
overflow-checks = false
