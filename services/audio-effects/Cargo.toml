[package]
name = "bingux-audio-effects"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Sound effects for the Bingux desktop: presets, plugin discovery and a PipeWire filter-chain engine"

[lib]
name = "bingux_audio_effects"
path = "src/lib.rs"

[[bin]]
name = "bingux-effects"
path = "src/main.rs"

[dependencies]
bingux-dsp = { path = "../../crates/dsp" }
libc = "0.2"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
