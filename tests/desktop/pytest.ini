[pytest]
# One entry point: `make test-desktop` (docs/desktop-testing.md).
addopts = -p no:cacheprovider -ra --strict-markers
testpaths = fast apps session
python_files = test_*.py
markers =
    fast: needs no compositor and no built Bingux program; runs anywhere
    app: runs a built Bingux app headless (its --snapshot mode); needs the Rust binaries, no compositor
    needs_gnoblin: starts the isolated Gnoblin + Bingux desktop (bubblewrap, nsenter, Gnoblin, Quickshell)
    needs_hardware: can only be verified on a real machine; skipped unless --hardware is given
    slow: takes more than about a minute
