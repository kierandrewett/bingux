[package]
name = "bsm-appearance"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Account discovery and greeter appearance publishing for the Bingux Session Manager (bsm), plus the sandboxed bsm-imgconv converter"

[lib]
name = "bsm_appearance"
path = "src/lib.rs"

[[bin]]
name = "bsm-imgconv"
path = "src/bin/bsm-imgconv.rs"

[dependencies]
bsm-proto = { path = "../proto" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
seccompiler = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
tempfile = "3"

# Image decoding and blurring dominate the test time; optimise the dependencies even in debug.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
panic = "abort"
