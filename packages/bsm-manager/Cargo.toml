[package]
name = "bsm-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Session manager core and I/O runtime of bsm, the Bingux Session Manager"

[lib]
path = "src/lib.rs"

[dependencies]
bsm-proto = { path = "../bsm-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }
tracing = "0.1"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
async-channel = "2"
futures-lite = "2"
async-io = "2"

[dev-dependencies]
tempfile = "3"

[workspace]
