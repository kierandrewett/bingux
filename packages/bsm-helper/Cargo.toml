[package]
name = "bsm-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Privileged PAM and session helper for the Bingux Session Manager (bsm)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "bsm-helper"
path = "src/main.rs"

[dependencies]
bsm-proto = { path = "../bsm-proto" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
