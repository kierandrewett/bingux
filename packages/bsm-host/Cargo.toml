[package]
name = "bsm-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Bridge between bsm (the Bingux Session Manager) and one hosted Gnoblin session"

[lib]
path = "src/lib.rs"

[[bin]]
name = "bsm-host"
path = "src/main.rs"

[features]
default = []
# Test-only: `--test-pattern` presents generated frames instead of Gnoblin's.
# Never enabled by the packages.
test-pattern = []

[dependencies]
bsm-proto = { path = "../bsm-proto" }
anyhow = "1"
async-channel = "2"
async-io = "2"
calloop = { version = "0.14", features = ["signals"] }
calloop-wayland-source = "0.4"
futures-util = "0.3"
libc = "0.2"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
memmap2 = "0.9"
pipewire = "0.10"
reis = "0.7"
rustix = { version = "1", features = ["fs", "mm", "shm", "net", "event"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wayland-backend = "0.3"
wayland-client = "0.31"
wayland-scanner = "0.31"
zbus = "5"

[dev-dependencies]
png = "0.18"
wayland-server = "0.31"
