[package]
name = "bingux-session"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Account, session and biometric facts for the Bingux lock screen and greeter"

[[bin]]
name = "bingux-session"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
shlex = "1"
zbus = { version = "5", default-features = false, features = [ "async-io", "blocking-api" ] }
