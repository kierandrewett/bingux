<?xml version="1.0" encoding="UTF-8"?>
<svg height="128px" viewBox="0 0 128 128" width="128px" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="face" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#ebeae8"/>
        </linearGradient>
        <linearGradient id="blue" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#1c71d8"/>
            <stop offset="1" stop-color="#3584e4"/>
        </linearGradient>
    </defs>
    <!-- The lower edge of the panel, as the Adwaita app icons draw depth. -->
    <rect fill="#9a9996" height="104" rx="16" width="104" x="12" y="16"/>
    <rect fill="url(#face)" height="104" rx="16" width="104" x="12" y="8"/>
    <rect fill="#ffffff" height="1.5" rx="0.75" width="88" x="20" y="8.5"/>
    <!-- Four specimens in a grid: a button, a radio, a switch and a slider,
         the controls the app lays out side by side. -->
    <rect fill="url(#blue)" height="26" rx="8" width="34" x="26" y="24"/>
    <circle cx="86" cy="37" fill="#c0bfbc" r="13"/>
    <circle cx="86" cy="37" fill="url(#blue)" r="6"/>
    <rect fill="#c0bfbc" height="22" rx="11" width="40" x="23" y="66"/>
    <circle cx="52" cy="77" fill="#ffffff" r="8.5"/>
    <rect fill="#c0bfbc" height="8" rx="4" width="42" x="68" y="73"/>
    <rect fill="url(#blue)" height="8" rx="4" width="24" x="68" y="73"/>
    <circle cx="92" cy="77" fill="#ffffff" r="7" stroke="#9a9996" stroke-width="1"/>
</svg>
