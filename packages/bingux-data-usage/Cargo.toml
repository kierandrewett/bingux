[package]
name = "bingux-data-usage"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Network data usage recorder and reader for the Bingux desktop"

[lib]
path = "src/lib.rs"

[dependencies]
libc = "0.2"
parking_lot = "0.12"
rusqlite = { version = "0.40", features = [ "bundled" ] }
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
