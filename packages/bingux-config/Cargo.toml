[package]
name = "bingux-config"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Declared configuration schema, TOML store and CLI for the Bingux desktop shell"

[lib]
path = "src/lib.rs"

[[bin]]
name = "bingux-config"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
toml = { version = "1", features = ["preserve_order"] }
toml_edit = { version = "0.25", features = ["serde"] }
url = "2"

[dev-dependencies]
tempfile = "3"
