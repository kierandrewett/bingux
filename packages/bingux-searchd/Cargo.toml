[package]
name = "bingux-searchd"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Local provider host for the Bingux desktop search surface"

[lib]
path = "src/lib.rs"

[[bin]]
name = "bingux-searchd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-io = "2"
futures-util = "0.3"
libc = "0.2"
ignore = "0.4"
meval = "0.2"
rusqlite = { version = "0.40", features = [ "bundled", "hooks" ] }
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
ureq = { version = "3", features = [ "json" ] }
zbus = "=4.4.0"
