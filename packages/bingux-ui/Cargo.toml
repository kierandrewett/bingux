[package]
name = "bingux-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Bingux design system for Freya applications"

[lib]
path = "src/lib.rs"

[features]
default = []
# Headless rendering for snapshots and tests.
testing = ["dep:freya-testing"]

[dependencies]
freya = { version = "0.5.0-rc.10", features = ["borderless", "titlebar"] }
freya-testing = { version = "0.5.0-rc.10", optional = true }
