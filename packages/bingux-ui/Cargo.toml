[package]
name = "bingux-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Bingux design system for Freya applications"

[lib]
path = "src/lib.rs"

[features]
default = []
# Headless rendering for snapshots and tests.
testing = ["dep:freya-testing", "dep:freya-components"]
# Every icon of the chat icon fork as `Icon::Chat(..)` (3 MB of outlines): for choosing glyphs.
chat-icons = []

[dependencies]
# `gif`: the picture viewer plays animated GIFs.
freya = { version = "0.5.0-rc.10", features = ["borderless", "titlebar", "engine", "gif"] }
freya-core = "0.5.0-rc.10"
torin = "0.5.0-rc.10"
freya-winit = "0.5.0-rc.10"
freya-testing = { version = "0.5.0-rc.10", optional = true }
# Snapshots mount the same root integration as the windowed app (Tab focus).
freya-components = { path = "../vendor/freya-components", optional = true }
accesskit = "0.24"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
# Grapheme clusters: a cut in a path or a name never lands inside one.
unicode-segmentation = "1"
# The filesystem model behind bingux_ui::files (no UI of its own).
bingux-files = { path = "../bingux-files" }
# What a file is and which viewer shows it, behind bingux_ui::preview (no UI of its own).
bingux-preview-core = { path = "../bingux-preview-core" }
# The search engine behind bingux_ui::search (documents, index, OpenSearch-shaped
# responses; no UI of its own).
bingux-search = { path = "../bingux-search" }

[dev-dependencies]
# A test's clipboard is memory (`controls::select_text::test_clipboard`): the
# system's belongs to the person at the desk. The version Freya's clipboard uses.
copypasta = "0.10"

# Desktop scroll feel; see ../vendor/README.md.
[patch.crates-io]
freya-winit = { path = "../vendor/freya-winit" }
freya-core = { path = "../vendor/freya-core" }
freya-animation = { path = "../vendor/freya-animation" }
freya-components = { path = "../vendor/freya-components" }
torin = { path = "../vendor/torin" }
winit = { path = "../vendor/winit" }

# Panics unwind, in dev and in release. The error boundaries and guards in the
# vendored freya-core catch a panic with `catch_unwind`, which does nothing under
# `panic = "abort"`: one failed component would end the process again. Both are
# Cargo's defaults, spelled out so nobody changes one for size.
# `scripts/ui-lint.py` fails when a Bingux app sets "abort".
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
