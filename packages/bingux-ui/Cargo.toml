[package]
name = "bingux-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Bingux design system for Freya applications"

[lib]
path = "src/lib.rs"

[features]
default = []
# Headless rendering for snapshots and tests.
testing = ["dep:freya-testing", "dep:freya-components"]

[dependencies]
freya = { version = "0.5.0-rc.10", features = ["borderless", "titlebar", "engine"] }
freya-core = "0.5.0-rc.10"
torin = "0.5.0-rc.10"
freya-winit = "0.5.0-rc.10"
freya-testing = { version = "0.5.0-rc.10", optional = true }
# Snapshots mount the same root integration as the windowed app (Tab focus).
freya-components = { path = "../vendor/freya-components", optional = true }
accesskit = "0.24"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

# Desktop scroll feel; see ../vendor/README.md.
[patch.crates-io]
freya-winit = { path = "../vendor/freya-winit" }
freya-components = { path = "../vendor/freya-components" }
