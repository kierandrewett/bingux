[package]
name = "bingux-settings"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Settings application for the Bingux desktop shell"

[[bin]]
name = "bingux-settings"
path = "src/main.rs"

[features]
default = []
# `bingux-settings --snapshot DIR` renders every page headlessly to PNG.
snapshot = ["bingux-ui/testing"]

[dependencies]
freya = { version = "0.5.0-rc.10", features = ["borderless", "titlebar"] }
bingux-ui = { path = "../bingux-ui" }
bingux-data-usage = { path = "../bingux-data-usage" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
bytes = "1"
libc = "0.2"

# Desktop scroll feel; see ../vendor/README.md.
[patch.crates-io]
freya-winit = { path = "../vendor/freya-winit" }
freya-components = { path = "../vendor/freya-components" }

# A debug build runs Freya's layout, Skia glue and the UI controls unoptimised,
# which makes scrolling and page changes visibly slow. Optimise every
# dependency and bingux-ui; bingux-settings itself stays at opt-level 0 so a
# rebuild after an edit stays quick. Debug assertions are off for them too:
# freya-core's `debug-integrity` walk of the whole scope and node trees runs
# after every update when they are on, about a tenth of the UI thread's time.
[profile.dev.package."*"]
opt-level = 2
debug-assertions = false
overflow-checks = false

[profile.dev.package.bingux-ui]
opt-level = 2
debug-assertions = false
overflow-checks = false
