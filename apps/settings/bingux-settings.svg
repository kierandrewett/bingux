<?xml version="1.0" encoding="UTF-8"?>
<svg height="128px" viewBox="0 0 128 128" width="128px" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="face" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#ebeae8"/>
        </linearGradient>
        <linearGradient id="blue" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#1c71d8"/>
            <stop offset="1" stop-color="#3584e4"/>
        </linearGradient>
    </defs>
    <!-- The lower edge of the panel, as the Adwaita app icons draw depth. -->
    <rect fill="#9a9996" height="104" rx="16" width="104" x="12" y="16"/>
    <rect fill="url(#face)" height="104" rx="16" width="104" x="12" y="8"/>
    <rect fill="#ffffff" height="1.5" rx="0.75" width="88" x="20" y="8.5"/>
    <!-- Three sliders: the control Bingux Settings is made of. -->
    <g fill="#c0bfbc">
        <rect height="10" rx="5" width="76" x="26" y="29"/>
        <rect height="10" rx="5" width="76" x="26" y="59"/>
        <rect height="10" rx="5" width="76" x="26" y="89"/>
    </g>
    <g fill="url(#blue)">
        <rect height="10" rx="5" width="50" x="26" y="29"/>
        <rect height="10" rx="5" width="26" x="26" y="59"/>
        <rect height="10" rx="5" width="62" x="26" y="89"/>
    </g>
    <g fill="#000000" opacity="0.18">
        <circle cx="76" cy="36.5" r="12"/>
        <circle cx="52" cy="66.5" r="12"/>
        <circle cx="88" cy="96.5" r="12"/>
    </g>
    <g fill="#ffffff" stroke="#9a9996" stroke-width="1.5">
        <circle cx="76" cy="34" r="11.25"/>
        <circle cx="52" cy="64" r="11.25"/>
        <circle cx="88" cy="94" r="11.25"/>
    </g>
</svg>
