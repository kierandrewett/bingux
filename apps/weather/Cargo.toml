[package]
name = "bingux-weather-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Weather, the forecast app of the Bingux desktop shell"
authors = ["Kieran Drewett"]
homepage = "https://github.com/kierandrewett/bingux"
repository = "https://github.com/kierandrewett/bingux"

# The package is `bingux-weather-app` because `bingux-weather` is the data model
# and the Open-Meteo client it shares with nothing else yet. The program and its
# desktop id are `bingux-weather`.
[[bin]]
name = "bingux-weather"
path = "src/main.rs"

[features]
default = []
# `bingux-weather --snapshot DIR` renders the window headlessly to PNG.
snapshot = ["bingux-ui/testing"]

[dependencies]
freya = { version = "0.5.0-rc.10", features = ["borderless", "titlebar"] }
# `location`: where the computer is, from the location portal or the network address.
bingux-ui = { path = "../../crates/ui", features = ["location"] }
bingux-weather = { path = "../../crates/weather" }
# The SVG bytes of a picture, as the charts hand them to the viewer.
bytes = "1"

# Desktop scroll feel; see ../../vendor/README.md.
[patch.crates-io]
freya-winit = { path = "../../vendor/freya-winit" }
freya-core = { path = "../../vendor/freya-core" }
freya-animation = { path = "../../vendor/freya-animation" }
freya-components = { path = "../../vendor/freya-components" }
torin = { path = "../../vendor/torin" }
winit = { path = "../../vendor/winit" }

# A debug build runs Freya's layout, Skia glue and the UI controls unoptimised,
# which makes scrolling visibly slow. Optimise every dependency and bingux-ui;
# the app itself stays at opt-level 0 so a rebuild after an edit stays quick.
# Debug assertions are off for them too: freya-core's `debug-integrity` walk of
# the node trees runs after every update when they are on.
[profile.dev.package."*"]
opt-level = 2
debug-assertions = false
overflow-checks = false

[profile.dev.package.bingux-ui]
opt-level = 2
debug-assertions = false
overflow-checks = false

# Panics unwind, in dev and in release. The error boundaries and guards in the
# vendored freya-core catch a panic with `catch_unwind`, which does nothing under
# `panic = "abort"`: one failed component would end the process again. Both are
# Cargo's defaults, spelled out so nobody changes one for size.
# `scripts/ui-lint.py` fails when a Bingux app sets "abort".
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
