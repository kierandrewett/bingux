<?xml version="1.0" encoding="UTF-8"?>
<svg height="128px" viewBox="0 0 128 128" width="128px" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="te-paper" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#fffefb"/>
            <stop offset="1" stop-color="#eeeae1"/>
        </linearGradient>
        <linearGradient id="te-flap" x1="86" x2="100" y1="30" y2="16" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#e6e0d5"/>
            <stop offset="1" stop-color="#fdfbf7"/>
        </linearGradient>
        <filter id="te-soft" x="-20" y="-20" width="168" height="168" filterUnits="userSpaceOnUse">
            <feGaussianBlur stdDeviation="2.2"/>
        </filter>
        <filter id="te-softer" x="-20" y="-20" width="168" height="168" filterUnits="userSpaceOnUse">
            <feGaussianBlur stdDeviation="1.2"/>
        </filter>
    </defs>
    <!-- The sheet: a soft shadow on the desk, its lower edge for thickness, then the page. -->
    <path d="M24 13h62l24 24v78a6 6 0 0 1-6 6H24a6 6 0 0 1-6-6V19a6 6 0 0 1 6-6z" fill="#000000" filter="url(#te-soft)" opacity="0.3"/>
    <path d="M24 13h62l24 24v78a6 6 0 0 1-6 6H24a6 6 0 0 1-6-6V19a6 6 0 0 1 6-6z" fill="#a8a296"/>
    <path d="M24 8h62l24 24v78a6 6 0 0 1-6 6H24a6 6 0 0 1-6-6V14a6 6 0 0 1 6-6z" fill="url(#te-paper)" stroke="#5e5446" stroke-opacity="0.12" stroke-width="0.6"/>
    <rect fill="#ffffff" height="1.5" opacity="0.9" rx="0.75" width="60" x="24" y="8.6"/>
    <!-- The folded corner: its shadow on the page, then the back of the flap. -->
    <path d="M86 8v20a4 4 0 0 0 4 4h20z" fill="#000000" filter="url(#te-softer)" opacity="0.32" transform="translate(-1.5 2)"/>
    <path d="M86 8v20a4 4 0 0 0 4 4h20z" fill="url(#te-flap)"/>
    <path d="M86 8l24 24" stroke="#ffffff" stroke-linecap="round" stroke-opacity="0.9" stroke-width="1"/>
    <!-- Plain text: a heading, then ragged lines of body. -->
    <rect fill="#9a958c" height="6" rx="3" width="40" x="29" y="22"/>
    <g fill="#c6c1b8">
        <rect height="5" rx="2.5" width="70" x="29" y="40"/>
        <rect height="5" rx="2.5" width="64" x="29" y="51"/>
        <rect height="5" rx="2.5" width="42" x="29" y="62"/>
        <rect height="5" rx="2.5" width="68" x="29" y="78"/>
        <rect height="5" rx="2.5" width="58" x="29" y="89"/>
        <rect height="5" rx="2.5" width="30" x="29" y="100"/>
    </g>
    <!-- The pen's shadow on the paper. -->
    <g filter="url(#te-soft)" opacity="0.42" transform="translate(3.5 5.5) translate(27 108) rotate(-40)">
        <path d="M0 0L24 -6.6H98a7.5 7.5 0 0 1 0 15H24z" fill="#000000"/>
    </g>
    <!-- A fountain pen, nib down to the left, lying across the page. -->
    <g transform="translate(27 108) rotate(-40)">
        <!-- Nib: two-tone gold, with its slit and breather hole. -->
        <path d="M0 0C6 -1.4 14 -6 25 -6.4V0z" fill="#f0c75e"/>
        <path d="M0 0C6 1.4 14 6 25 6.4V0z" fill="#d19e33"/>
        <path d="M2 0H15" stroke="#6b4a10" stroke-linecap="round" stroke-width="1"/>
        <circle cx="16.4" cy="0" fill="#6b4a10" r="1.5"/>
        <!-- Grip, barrel and cap: one near-flat dark body with a rounded end. -->
        <path d="M24 -6.2L36 -8H97a8 8 0 0 1 0 16H36L24 6.2z" fill="#2a2b31"/>
        <!-- One soft highlight along the top. -->
        <path d="M27 -4.6L34 -5.4M43 -5.2H98" stroke="#ffffff" stroke-linecap="round" stroke-opacity="0.3" stroke-width="1.6"/>
        <!-- Plain metal band between grip and cap. -->
        <rect fill="#c0bfbc" height="17.2" rx="1.2" width="5" x="35.5" y="-8.6"/>
        <!-- Clip on the cap. -->
        <path d="M76 0H100" stroke="#9a9996" stroke-linecap="round" stroke-width="3"/>
    </g>
</svg>
